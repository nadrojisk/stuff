name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # scripts/ only: the dotconfig rc files are interactive (and zsh, which shellcheck can't parse).
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  ruff:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Syntax errors, undefined names, unused imports/variables -- not style opinions.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --isolated --select E4,E7,E9,F

  psscriptanalyzer:
    name: PowerShell (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Errors only: the setup scripts use Write-Host on purpose, so warnings would just be noise.
      - uses: microsoft/psscriptanalyzer-action@v1.1
        with:
          path: .
          recurse: true
          severity: '"Error"'
          enableExit: true

  desktop-profile:
    name: Desktop profile installs cleanly and keeps the WSL settings to WSL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fish zsh
      - name: Install into an empty HOME, twice (the second run must change nothing)
        run: |
          export HOME="$(mktemp -d)"
          make install
          make install | grep -E '^  (link|warn|ERROR) ' && { echo "second run was not a no-op"; exit 1; } || true
          make check | tail -n +3 | grep -v ' OK$' && { echo "a link is not OK"; exit 1; } || true
          echo "HOME=$HOME" >> "$GITHUB_ENV"
      - name: Shell configs parse
        run: |
          fish --no-execute dotconfig/fish/config.fish
          zsh -n dotconfig/zsh/.zshrc
          bash -n dotconfig/bash/.bashrc
      - name: Plain Linux gets no Windows ssh or signer
        run: |
          for key in core.sshCommand gpg.ssh.program; do
            if value="$(git config --global --includes --get "$key")"; then
              echo "$key is set to '$value' on plain Linux"; exit 1
            fi
          done
          test -z "$(fish -c 'echo $BROWSER')" || { echo "BROWSER is set outside WSL"; exit 1; }

  server-profile:
    name: Server profile installs cleanly and stays free of WSL-specific content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fish
      - name: Install into an empty HOME, twice (the second run must change nothing)
        run: |
          export HOME="$(mktemp -d)"
          make install-server
          make install-server | grep -v '^  skip ' && { echo "second run was not a no-op"; exit 1; } || true
          make check-server | tail -n +3 | grep -v ' OK$' && { echo "a link is not OK"; exit 1; } || true
      - name: fish config parses
        run: fish --no-execute dotconfig/fish/conf.d/10-server.fish
      - name: No WSL-specific content in anything the server profile links
        run: |
          if make -s list-server | xargs grep -rIEn 'WSLENV|wslview|[a-z]\.exe\b|/mnt/[a-z]/'; then
            echo "the server profile links a file with WSL-specific content"; exit 1
          fi
      - name: Server git config has no identity or signing key
        run: |
          if grep -nE '^\s*(name|email|signingkey|gpgsign)\s*=' dotconfig/git/server.gitconfig dotconfig/git/aliases.gitconfig; then
            echo "server git config must not set an identity or signing key"; exit 1
          fi
